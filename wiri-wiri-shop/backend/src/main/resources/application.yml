spring:
  application:
    name: wiri-wiri-shop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wiriwiri}
    username: ${DB_USER:wiriwiri}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 16MB
      # Tout reste en mémoire : la note vocale n'est jamais écrite dans un fichier temporaire.
      file-size-threshold: 16MB
  threads:
    virtual:
      enabled: false

server:
  port: ${PORT:8080}
  # Le TLS 1.3 est terminé ici (profil "tls") ou par le reverse proxy (Nginx/Caddy).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

wiriwiri:
  securite:
    # Secret HMAC-SHA256 des JWT : >= 32 octets, encodé en Base64.
    jwt-secret: ${JWT_SECRET}
    jwt-duree: ${JWT_DUREE:PT30M}
    # Clé AES-256 (32 octets, Base64) pour le chiffrement au repos.
    cle-aes: ${AES_KEY}
    # Poivre HMAC pour le hachage des codes OTP (Base64).
    poivre-otp: ${OTP_PEPPER}
    otp-duree: PT5M
    otp-tentatives-max: 5
    origines-autorisees: ${CORS_ORIGINS:http://localhost:3000}
  limitation:
    requetes-par-minute: ${RATE_LIMIT_GLOBAL:120}
    auth-requetes-par-minute: ${RATE_LIMIT_AUTH:5}
  ia:
    # Par défaut : API OpenAI (payante). Version gratuite en local : profil "ia-locale".
    transcription:
      base-url: ${TRANSCRIPTION_URL:https://api.openai.com/v1}
      cle-api: ${TRANSCRIPTION_API_KEY:${OPENAI_API_KEY:}}
      modele: ${WHISPER_MODEL:whisper-1}
    extraction:
      base-url: ${EXTRACTION_URL:https://api.openai.com/v1}
      cle-api: ${EXTRACTION_API_KEY:${OPENAI_API_KEY:}}
      modele: ${LLM_MODEL:gpt-4o-mini}
    # Code langue ISO-639-1 envoyé à Whisper. Si le service refuse la langue,
    # le backend relance automatiquement en détection automatique.
    langue: ${WHISPER_LANGUE:wo}
    delai: ${IA_DELAI:PT60S}
  stockage:
    repertoire: ${STORAGE_DIR:./data/uploads}
    url-publique: ${STORAGE_PUBLIC_URL:http://localhost:8080/fichiers}
