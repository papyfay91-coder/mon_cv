services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wiriwiri
      POSTGRES_USER: wiriwiri
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiriwiri"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/wiriwiri
      DB_USER: wiriwiri
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      AES_KEY: ${AES_KEY:?AES_KEY requis}
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER requis}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WHISPER_LANGUE: ${WHISPER_LANGUE:-wo}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: https://${DOMAINE_VITRINE}
      STORAGE_PUBLIC_URL: https://${DOMAINE_API}/fichiers
      # Derrière Caddy : la vraie IP client (pour Bucket4j) vient de X-Forwarded-For.
      FORWARD_HEADERS_STRATEGY: native
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  vitrine:
    build:
      context: ./vitrine-web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAINE_API}
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE_API: ${DOMAINE_API}
      DOMAINE_VITRINE: ${DOMAINE_VITRINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - vitrine
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
